name: Build/Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    # electron-builder uploads the installers to the GitHub release.
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      - name: Build Bundle
        run: npx vite build

      - name: Rebuild native modules
        run: npm run rebuild

      # electron-builder reads an empty CSC_LINK as "a certificate was configured" and tries to
      # import it, so passing the optional secrets verbatim fails the macOS job with
      # "<repo root> not a file". Export them only when they actually hold a value.
      - name: Export Code Signing Settings
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          export_var() {
            printf '%s<<%s_EOF\n%s\n%s_EOF\n' "$1" "$1" "$2" "$1" >> "$GITHUB_ENV"
          }
          if [ -n "$CSC_LINK_VALUE" ]; then
            export_var CSC_LINK "$CSC_LINK_VALUE"
            export_var CSC_KEY_PASSWORD "$CSC_KEY_PASSWORD_VALUE"
          fi
          if [ -n "$APPLE_ID_VALUE" ]; then
            export_var APPLE_ID "$APPLE_ID_VALUE"
            export_var APPLE_TEAM_ID "$APPLE_TEAM_ID_VALUE"
            export_var APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD_VALUE"
          fi

      - name: Build & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always
