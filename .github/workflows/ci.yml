name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      # Verify the app actually bundles. Deliberately not `npm run build`, which would run
      # electron-builder and try to package/sign the app.
      - name: Build
        run: npx vite build

      # Advisory report only: an audit finding must never block a push or a PR.
      - name: Dependency Audit
        run: npm audit --audit-level=high
        continue-on-error: true
